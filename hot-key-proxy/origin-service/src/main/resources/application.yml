server:
  port: 8080
  tomcat:
    max-connections: 20000
    accept-count: 1000

spring:
  application:
    name: origin-service
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/catalog}
    username: ${SPRING_DATASOURCE_USERNAME:catalog}
    password: ${SPRING_DATASOURCE_PASSWORD:catalog}
    hikari:
      pool-name: origin-pool
      maximum-pool-size: ${ORIGIN_POOL_SIZE:20}
      minimum-idle: 2
      connection-timeout: 5000
  sql:
    init:
      mode: always

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus,info
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  metrics:
    tags:
      application: origin-service

seed:
  enabled: ${SEED_ENABLED:true}
  products: ${SEED_PRODUCTS:100000}
  reviews: ${SEED_REVIEWS:1000000}

origin:
  extra-delay-ms: ${ORIGIN_EXTRA_DELAY_MS:0}

logging:
  level:
    com.hotkey: INFO
