server:
  port: 8080
  tomcat:
    max-connections: 20000
    accept-count: 1000

spring:
  application:
    name: gateway
  threads:
    virtual:
      enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus,info
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  metrics:
    tags:
      application: gateway

gateway:
  proxies: ${GATEWAY_PROXIES:http://localhost:8091,http://localhost:8092,http://localhost:8093}
  origin-base-url: ${GATEWAY_ORIGIN_BASE_URL:http://localhost:8081}
  self-base-url: ${GATEWAY_SELF_BASE_URL:http://127.0.0.1:8080}
  prometheus-url: ${GATEWAY_PROMETHEUS_URL:http://localhost:9090}
  virtual-nodes: ${GATEWAY_VIRTUAL_NODES:150}
  product-count: ${GATEWAY_PRODUCT_COUNT:100000}

logging:
  level:
    com.hotkey: INFO
