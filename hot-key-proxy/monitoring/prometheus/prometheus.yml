global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: origin
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["origin:8080"]
  - job_name: proxy
    metrics_path: /api/metrics
    static_configs:
      - targets: ["proxy-1:8080", "proxy-2:8080", "proxy-3:8080"]
  - job_name: gateway
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["gateway:8080"]
  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]
